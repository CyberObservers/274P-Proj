name: hepmass
# from UCI 347 hepmass.zip we use 1000_train.csv.gz / 1000_test.csv.gz
raw_path:      data/raw/1000_train.csv.gz
raw_path_test: data/raw/1000_test.csv.gz
processed_dir: data/processed/hepmass
task: binary_classification
n_total: 10500000
n_samples: 500000
test_split: 100000
val_split: 0.05
target_col: 0
# 1000_train: label + 27 features (28 cols). 1000_test has +1 mass col we drop.
n_features: 27
n_low: 0
n_high: 0
training:
  batch_size: 1024
  epochs: 40
  lr: 1.0e-3
  weight_decay: 1.0e-5
  warmup_epochs: 2
  amp: true
  early_stop_patience: 8
